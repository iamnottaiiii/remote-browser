<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Browser</title>
<style>
  body { font-family: monospace; background: #fff; color: #111; padding: 40px 24px; font-size: 20px; }
</style>
</head>
<body>
<p>Starting...</p>
<script>
  fetch('https://raw.githubusercontent.com/iamnottaiiii/remote-browser/main/live.json?t=' + Date.now())
    .then(r => r.json())
    .then(d => {
      const fresh = d.heartbeat && (Date.now() - new Date(d.heartbeat).getTime() < 6 * 60 * 1000);
      if (d.url && fresh) {
        window.location.replace(d.url);
      } else {
        setTimeout(() => window.location.reload(), 15000);
      }
    })
    .catch(() => setTimeout(() => window.location.reload(), 15000));
</script>
</body>
</html>
